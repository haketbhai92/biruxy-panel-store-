<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIRUXY DIGITAL SHOP</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b12;
  color:white;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#111722;
  padding:30px;
  border-radius:18px;
  border:1px solid #263244;
  box-shadow:0 15px 50px #0008;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#9da8ba;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #344052;
  background:#080d15;
  color:white;
  outline:none;
}

.main-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#18d26e;
  color:#06100a;
  font-weight:bold;
  margin-top:10px;
}

.link-btn{
  width:100%;
  border:0;
  background:none;
  color:#4da3ff;
  margin-top:16px;
}

/* HEADER */

header{
  padding:18px 25px;
  background:#101620;
  border-bottom:1px solid #263244;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.header-logo{
  font-size:22px;
  font-weight:bold;
}

.header-right{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.small-btn{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #344052;
  background:#182130;
  color:white;
  text-decoration:none;
}

/* SHOP */

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.search{
  margin-bottom:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.card{
  background:#111722;
  border:1px solid #263244;
  border-radius:15px;
  padding:20px;
}

.card h3{
  margin-bottom:10px;
}

.type{
  color:#9da8ba;
  font-size:14px;
  margin-bottom:15px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:15px;
}

.buy{
  width:100%;
  padding:12px;
  background:#18d26e;
  color:#06100a;
  border:0;
  border-radius:9px;
  font-weight:bold;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal-box{
  width:100%;
  max-width:450px;
  max-height:90vh;
  overflow:auto;
  background:#111722;
  border:1px solid #2c394c;
  border-radius:16px;
  padding:25px;
}

.close{
  float:right;
  background:none;
  color:white;
  border:0;
  font-size:24px;
}

.plans{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.plan{
  padding:13px 5px;
  background:#182130;
  border:1px solid #344052;
  color:white;
  border-radius:8px;
}

.plan.active{
  background:#18d26e;
  color:#06100a;
}

.qr{
  text-align:center;
  margin-top:20px;
}

.qr img{
  width:280px;
  max-width:100%;
  background:white;
  padding:10px;
  border-radius:10px;
}

.upi{
  margin:12px 0;
  color:#b8c2d1;
  word-break:break-all;
}

.order-result{
  margin-top:15px;
  padding:15px;
  background:#182130;
  border-radius:10px;
}

/* ADMIN */

.admin-order{
  border:1px solid #344052;
  border-radius:10px;
  padding:15px;
  margin:10px 0;
}

.admin-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.approve{
  background:#18d26e;
  color:#06100a;
  border:0;
  padding:9px 13px;
  border-radius:7px;
}

.reject{
  background:#e74c3c;
  color:white;
  border:0;
  padding:9px 13px;
  border-radius:7px;
}

.status{
  margin-top:8px;
  color:#aeb9c9;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="auth">

  <div class="auth-box">

    <div class="logo">
      BIRUXY DIGITAL SHOP
    </div>

    <div class="sub">
      Login to continue
    </div>

    <input
      id="loginUsername"
      placeholder="Username"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button class="main-btn" onclick="login()">
      LOGIN
    </button>

    <button class="link-btn" onclick="openRegister()">
      New user? REGISTER
    </button>

    <p id="loginMsg"
       style="text-align:center;margin-top:15px;">
    </p>

  </div>

</div>


<!-- SHOP -->

<div id="shopPage" class="hidden">

<header>

  <div class="header-logo">
    BIRUXY DIGITAL SHOP
  </div>

  <div class="header-right">

    <!-- TELEGRAM -->

    <a
      href="https://t.me/biruxy7"
      target="_blank"
      rel="noopener noreferrer"
      class="small-btn"
      style="background:#229ED9;border-color:#229ED9;"
    >
      📲 Telegram @biruxy7
    </a>

    <button
      class="small-btn"
      onclick="showKeys()"
    >
      My Key
    </button>

    <button
      class="small-btn"
      onclick="openAdmin()"
    >
      Admin
    </button>

    <button
      class="small-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<div class="container">

  <input
    class="search"
    id="search"
    placeholder="Search product..."
    oninput="renderProducts()"
  >

  <div
    id="products"
    class="products"
  ></div>

</div>

</div>


<!-- REGISTER -->

<div
  id="registerModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeRegister()"
    >
      ×
    </button>

    <h2>Create Account</h2>

    <input
      id="registerUsername"
      placeholder="Username"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="main-btn"
      onclick="register()"
    >
      REGISTER
    </button>

    <p
      id="registerMsg"
      style="margin-top:12px;"
    ></p>

  </div>

</div>


<!-- BUY MODAL -->

<div
  id="buyModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeBuy()"
    >
      ×
    </button>

    <h2 id="buyProduct"></h2>

    <p
      id="buyType"
      class="type"
    ></p>

    <div class="plans">

      <button
        class="plan"
        onclick="selectPlan(1,this)"
      >
        1 Day
      </button>

      <button
        class="plan"
        onclick="selectPlan(3,this)"
      >
        3 Days
      </button>

      <button
        class="plan"
        onclick="selectPlan(7,this)"
      >
        7 Days
      </button>

    </div>

    <div
      id="paymentArea"
      class="hidden"
    >

      <h3 id="selectedPrice"></h3>

      <div class="qr">

        <img
          id="qrImage"
          alt="UPI QR"
        >

        <div class="upi">

          UPI ID:<br>

          <b>
            shadablegend808@oksbi
          </b>

        </div>

        <p
          style="color:#9da8ba;margin-bottom:12px;"
        >
          QR scan karke selected amount pay karein.
        </p>

      </div>

      <button
        class="main-btn"
        onclick="submitOrder(this)"
      >
        I HAVE PAID
      </button>

      <div id="orderMessage"></div>

    </div>

  </div>

</div>


<!-- MY KEY -->

<div
  id="keyModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeKeys()"
    >
      ×
    </button>

    <h2>
      My Orders / Keys
    </h2>

    <div
      id="myOrders"
      style="margin-top:15px;"
    ></div>

  </div>

</div>


<!-- ADMIN -->

<div
  id="adminModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeAdmin()"
    >
      ×
    </button>

    <h2>
      Admin Panel
    </h2>

    <input
      id="adminPassword"
      type="password"
      placeholder="Admin Password"
    >

    <button
      class="main-btn"
      onclick="loadAdminOrders()"
    >
      LOAD ORDERS
    </button>

    <div
      id="adminOrders"
      style="margin-top:15px;"
    ></div>

  </div>

</div>

{

{

},

{
name:"SBK Mods",

},

{
name:"Shadow X",

},

{
name:"Pato Team",

prices:{1:94,3:194,7:344}
},

{
name:"Silent Cheat",
type:"Root",
prices:{1:108,3:228,7:388}
},

{
name:"Prime Hook",
type:"Non-Root",
prices:{1:100,3:200,7:350}
}

];


/* VARIABLES */

let selectedProduct = null;
let selectedPlan = null;


/* REGISTER */

function openRegister(){

  document
  .getElementById("registerModal")
  .classList.remove("hidden");

}

function closeRegister(){

  document
  .getElementById("registerModal")
  .classList.add("hidden");

}


async function register(){

  const username =
    document
    .getElementById("registerUsername")
    .value
    .trim();

  const password =
    document
    .getElementById("registerPassword")
    .value;

  const msg =
    document.getElementById("registerMsg");


  if(!username || !password){

    msg.textContent =
      "Username aur password required hai.";

    return;
  }


  try{

    const response =
      await fetch("/api/register",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          username,
          password
        })

      });


    const data =
      await response.json();


    msg.textContent =
      data.message;


    if(data.success){

      document
      .getElementById("registerUsername")
      .value="";

      document
      .getElementById("registerPassword")
      .value="";

      setTimeout(
        closeRegister,
        700
      );

    }

  }catch(error){

    msg.textContent =
      "Server se connection nahi ho raha.";

  }

}


/* LOGIN */

async function login(){

  const username =
    document
    .getElementById("loginUsername")
    .value
    .trim();

  const password =
    document
    .getElementById("loginPassword")
    .value;

  const msg =
    document.getElementById("loginMsg");


  if(!username || !password){

    msg.textContent =
      "Username aur password required hai.";

    return;
  }


  try{

    const response =
      await fetch("/api/login",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          username,
          password
        })

      });


    const data =
      await response.json();


    if(data.success){

      localStorage.setItem(
        "biruxyUser",
        username
      );

      showShop();

    }else{

      msg.textContent =
        data.message;

    }

  }catch(error){

    msg.textContent =
      "Server se connection nahi ho raha.";

  }

}


/* SHOP */

function showShop(){

  document
  .getElementById("loginPage")
  .classList.add("hidden");

  document
  .getElementById("shopPage")
  .classList.remove("hidden");

  renderProducts();

}


function logout(){

  localStorage.removeItem(
    "biruxyUser"
  );

  location.reload();

}


/* PRODUCTS */

function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document
    .getElementById("search")
    .value
    .toLowerCase();


  container.innerHTML="";


  products
  .filter(p =>

    (p.name+" "+p.type)
    .toLowerCase()
    .includes(search)

  )
  .forEach((p,index)=>{

    container.innerHTML += `

      <div class="card">

        <h3>${p.name}</h3>

        <div class="type">
          ${p.type}
        </div>

        <div class="price">
          ₹${p.prices[1]} / 1D
        </div>

        <button
          class="buy"
          onclick="openBuy(${index})"
        >
          BUY NOW
        </button>

      </div>

    `;

  });

}


/* BUY */

function openBuy(index){

  selectedProduct =
    products[index];

  selectedPlan = null;


  document
  .getElementById("buyProduct")
  .textContent =
    selectedProduct.name;


  document
  .getElementById("buyType")
  .textContent =
    selectedProduct.type;


  document
  .getElementById("paymentArea")
  .classList.add("hidden");


  document
  .getElementById("orderMessage")
  .innerHTML="";


  document
  .querySelectorAll(".plan")
  .forEach(btn =>
    btn.classList.remove("active")
  );


  document
  .getElementById("buyModal")
  .classList.remove("hidden");

}


function closeBuy(){

  document
  .getElementById("buyModal")
  .classList.add("hidden");

}


/* UPI QR */

function selectPlan(days,button){

  selectedPlan = days;


  document
  .querySelectorAll(".plan")
  .forEach(btn =>
    btn.classList.remove("active")
  );


  button.classList.add("active");


  const amount =
    selectedProduct.prices[days];


  document
  .getElementById("selectedPrice")
  .textContent =
    days + " Day Plan — ₹" + amount;


  const upiId =
    "shadablegend808@oksbi";


  const shopName =
    "BIRUXY DIGITAL SHOP";


  const upiLink =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(upiId) +
    "&pn=" +
    encodeURIComponent(shopName) +
    "&am=" +
    encodeURIComponent(amount) +
    "&cu=INR";


  const qrUrl =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=300x300" +
    "&data=" +
    encodeURIComponent(upiLink);


  document
  .getElementById("qrImage")
  .src =
    qrUrl;


  document
  .getElementById("paymentArea")
  .classList
  .remove("hidden");

}


/* ORDER */

async function submitOrder(button){

  if(!selectedProduct ||
     !selectedPlan){

    alert(
      "Pehle plan select karo."
    );

    return;
  }


  const username =
    localStorage.getItem(
      "biruxyUser"
    );


  const price =
    selectedProduct
    .prices[selectedPlan];


  const orderId =
    "BRX-" +
    Date.now()
    .toString(36)
    .toUpperCase();


  button.disabled = true;

  button.textContent =
    "Submitting...";


  try{

    const response =
      await fetch("/api/orders",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          orderId:orderId,

          username:username,

          product:
            selectedProduct.name,

          type:
            selectedProduct.type,

          plan:
            selectedPlan + " Days",

          price:price

        })

      });


    const data =
      await response.json();


    if(data.success){

      document
      .getElementById("orderMessage")
      .innerHTML = `

        <div class="order-result">

          <b>
            Order Submitted ✅
          </b>

          <p style="margin-top:8px;">
            Order ID:
            <b>${orderId}</b>
          </p>

          <p
            style="
              margin-top:8px;
              color:#9da8ba;
            "
          >
            Admin approval ke baad
            My Key section me key dikhegi.
          </p>

        </div>

      `;

    }else{

      alert(data.message);

    }

  }catch(error){

    alert(
      "Server error."
    );

  }


  button.disabled = false;

  button.textContent =
    "I HAVE PAID";

}


/* MY KEY */

async function showKeys(){

  document
  .getElementById("keyModal")
  .classList
  .remove("hidden");


  const username =
    localStorage.getItem(
      "biruxyUser"
    );


  const box =
    document.getElementById(
      "myOrders"
    );


  box.innerHTML =
    "Loading...";


  try{

    const response =
      await fetch(
        "/api/mykey?username=" +
        encodeURIComponent(username)
      );


    const data =
      await response.json();


    if(!data.orders ||
       data.orders.length===0){

      box.innerHTML =
        "<p>No orders yet.</p>";

      return;

    }


    box.innerHTML="";


    data.orders.forEach(order=>{

      box.innerHTML += `

        <div class="admin-order">

          <b>
            ${order.product}
          </b>

          <p style="margin-top:7px;">
            Plan: ${order.plan}
          </p>

          <p>
            Price: ₹${order.price}
          </p>

          <p>
            Order ID: ${order.orderId}
          </p>

          <p class="status">
            Status: ${order.status}
          </p>

          ${
            order.key
            ?
            `
            <p style="margin-top:10px;">
              My Key:
              <b>${order.key}</b>
            </p>
            `
            :
            ""
          }

        </div>

      `;

    });

  }catch(error){

    box.innerHTML =
      "Server error.";

  }

}


function closeKeys(){

  document
  .getElementById("keyModal")
  .classList
  .add("hidden");

}


/* ADMIN */

function openAdmin(){

  document
  .getElementById("adminModal")
  .classList
  .remove("hidden");

}


function closeAdmin(){

  document
  .getElementById("adminModal")
  .classList
  .add("hidden");

}


async function loadAdminOrders(){

  const password =
    document
    .getElementById("adminPassword")
    .value;


  const box =
    document
    .getElementById("adminOrders");


  box.innerHTML =
    "Loading...";


  try{

    const response =
      await fetch(
        "/api/admin/orders",
        {
          headers:{
            "admin-password":
              password
          }
        }
      );


    const data =
      await response.json();


    if(!data.success){

      box.innerHTML =
        "<p>Wrong admin password.</p>";

      return;

    }


    if(data.orders.length===0){

      box.innerHTML =
        "<p>No orders.</p>";

      return;

    }


    box.innerHTML="";


    data.orders.forEach(order=>{

      box.innerHTML += `

        <div class="admin-order">

          <b>
            ${order.product}
          </b>

          <p>
            User:
            ${order.username}
          </p>

          <p>
            Plan:
            ${order.plan}
          </p>

          <p>
            Price:
            ₹${order.price}
          </p>

          <p>
            Order ID:
            ${order.orderId}
          </p>

          <p class="status">
            Status:
            ${order.status}
          </p>

          ${
            order.key
            ?
            `
            <p style="margin-top:8px;">
              Key:
              <b>${order.key}</b>
            </p>
            `
            :
            ""
          }

          ${
            order.status==="pending"
            ?
            `

            <div class="admin-actions">

              <button
                class="approve"
                onclick="approveOrder('${order.orderId}')"
              >
                APPROVE
              </button>

              <button
                class="reject"
                onclick="rejectOrder('${order.orderId}')"
              >
                REJECT
              </button>

            </div>

            `
            :
            ""
          }

        </div>

      `;

    });

  }catch(error){

    box.innerHTML =
      "Server error.";

  }

}


/* APPROVE */

async function approveOrder(orderId){

  const password =
    document
    .getElementById("adminPassword")
    .value;


  const response =
    await fetch(
      "/api/admin/approve",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json",
