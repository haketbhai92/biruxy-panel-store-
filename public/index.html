<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIRUXY DIGITAL SHOP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
}

header{
    background:#111;
    border-bottom:1px solid #292929;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    color:#ff1e1e;
    font-size:22px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:10px;
    align-items:center;
}

button{
    cursor:pointer;
}

.navbtn{
    background:#191919;
    border:1px solid #333;
    color:white;
    padding:10px 15px;
    border-radius:8px;
}

.navbtn:hover{
    border-color:#ff2020;
}

.hero{
    text-align:center;
    padding:55px 20px 35px;
}

.hero h1{
    font-size:42px;
    color:#ff2424;
}

.hero p{
    color:#aaa;
    margin-top:12px;
}

.searchbox{
    width:90%;
    max-width:700px;
    margin:20px auto;
}

.searchbox input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #333;
    background:#111;
    color:white;
    outline:none;
}

.products{
    width:92%;
    max-width:1200px;
    margin:30px auto 60px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    padding:20px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#ff2020;
}

.card h3{
    color:#fff;
    margin-bottom:10px;
}

.type{
    color:#999;
    font-size:14px;
    min-height:20px;
}

.prices{
    margin:18px 0;
    line-height:2;
}

.price{
    color:#ff3636;
    font-weight:bold;
}

.buy{
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:#e71919;
    color:white;
    font-weight:bold;
}

.buy:hover{
    background:#ff3030;
}

/* modal */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modalbox{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    padding:25px;
}

.modalbox h2{
    margin-bottom:18px;
    color:#ff2929;
}

.close{
    float:right;
    background:none;
    border:none;
    color:#aaa;
    font-size:24px;
}

.plan{
    width:100%;
    margin:8px 0;
    padding:13px;
    background:#191919;
    border:1px solid #333;
    color:white;
    border-radius:8px;
    text-align:left;
}

.plan:hover{
    border-color:#ff2222;
}

.form input{
    width:100%;
    padding:13px;
    margin:7px 0;
    background:#0b0b0b;
    border:1px solid #333;
    border-radius:8px;
    color:white;
}

.form button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    background:#e71919;
    color:white;
    font-weight:bold;
}

.switch{
    text-align:center;
    margin-top:15px;
    color:#aaa;
}

.switch span{
    color:#ff3030;
    cursor:pointer;
}

.userinfo{
    display:none;
    color:#ddd;
    font-size:14px;
}
</style>
</head>

<body>

<header>
    <div class="logo">BIRUXY DIGITAL SHOP</div>

    <nav>
        <button class="navbtn" onclick="openLogin()">LOGIN</button>
        <button class="navbtn" onclick="openRegister()">REGISTER</button>
        <button class="navbtn" onclick="logout()">LOGOUT</button>
    </nav>
</header>

<section class="hero">
    <h1>BIRUXY DIGITAL SHOP</h1>
    <p>Premium Digital Products</p>
</section>

<div class="searchbox">
    <input
        type="text"
        id="search"
        placeholder="Search product..."
        oninput="searchProducts()"
    >
</div>

<section class="products" id="products"></section>


<!-- LOGIN -->

<div class="modal" id="loginModal">
    <div class="modalbox">

        <button class="close" onclick="closeAll()">×</button>

        <h2>Login</h2>

        <div class="form">

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button onclick="login()">LOGIN</button>

        </div>

        <div class="switch">
            Don't have an account?
            <span onclick="openRegister()">Register</span>
        </div>

    </div>
</div>


<!-- REGISTER -->

<div class="modal" id="registerModal">
    <div class="modalbox">

        <button class="close" onclick="closeAll()">×</button>

        <h2>New Register</h2>

        <div class="form">

            <input
                type="text"
                id="registerUsername"
                placeholder="Create username"
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Create password"
            >

            <input
                type="password"
                id="registerConfirm"
                placeholder="Confirm password"
            >

            <button onclick="register()">REGISTER</button>

        </div>

        <div class="switch">
            Already have account?
            <span onclick="openLogin()">Login</span>
        </div>

    </div>
</div>


<!-- PRODUCT MODAL -->

<div class="modal" id="productModal">
    <div class="modalbox">

        <button class="close" onclick="closeAll()">×</button>

        <h2 id="selectedProduct"></h2>

        <button class="plan" id="p1"></button>
        <button class="plan" id="p3"></button>
        <button class="plan" id="p7"></button>

    </div>
</div>


<script>

const products = [

{
name:"Paradox",
type:"Root / Non-Root",
d1:99,d3:199,d7:349
},

{
name:"Rapid Core",
type:"Root / Non-Root",
d1:109,d3:209,d7:359
},

{
name:"Drip Client",
type:"Non-Root",
d1:89,d3:189,d7:339
},

{
name:"Drip Client",
type:"Root",
d1:105,d3:205,d7:355
},

{
name:"Drip Proxy",
type:"Root / Non-Root",
d1:95,d3:195,d7:345
},

{
name:"Invisible Mods",
type:"Root",
d1:110,d3:220,d7:380
},

{
name:"BR Mods",
type:"Root / Non-Root",
d1:102,d3:202,d7:352
},

{
name:"Hexxx Cher",
type:"Root",
d1:98,d3:198,d7:348
},

{
name:"HG Cheats",
type:"Root / Non-Root",
d1:108,d3:218,d7:368
},

{
name:"Hex Blaze",
type:"Root / Non-Root",
d1:104,d3:214,d7:364
},

{
name:"Bhikari Mods",
type:"Root / Non-Root",
d1:96,d3:196,d7:346
},

{
name:"Neo Strike",
type:"Root",
d1:109,d3:229,d7:389
},

{
name:"Reaper X Proo",
type:"Root",
d1:110,d3:230,d7:390
},

{
name:"LK Team",
type:"Root / Non-Root",
d1:101,d3:211,d7:361
},

{
name:"Angry Mods",
type:"Root",
d1:107,d3:217,d7:367
},

{
name:"XYZ",
type:"Non-Root",
d1:90,d3:180,d7:330
},

{
name:"Kos Mods",
type:"Root",
d1:106,d3:216,d7:366
},

{
name:"GBox eSign",
type:"Root / Non-Root",
d1:99,d3:209,d7:359
},

{
name:"SBK Mods",
type:"Root",
d1:103,d3:213,d7:363
},

{
name:"Shadow X",
type:"Root",
d1:109,d3:229,d7:389
},

{
name:"Pato Team",
type:"Non-Root / Non-Root",
d1:94,d3:194,d7:344
},

{
name:"Silent Cheat",
type:"Root",
d1:108,d3:228,d7:388
},

{
name:"Prime Hook",
type:"Non-Root",
d1:100,d3:200,d7:350
}

];


function displayProducts(list=products){

    const container=document.getElementById("products");

    container.innerHTML="";

    list.forEach((p,index)=>{

        container.innerHTML += `

        <div class="card">

            <h3>${p.name}</h3>

            <div class="type">${p.type}</div>

            <div class="prices">

                1 Day:
                <span class="price">₹${p.d1}</span>
                <br>

                3 Days:
                <span class="price">₹${p.d3}</span>
                <br>

                7 Days:
                <span class="price">₹${p.d7}</span>

            </div>

            <button
                class="buy"
                onclick="openProduct(${index})"
            >
                BUY NOW
            </button>

        </div>

        `;

    });

}


function searchProducts(){

    const text=
        document.getElementById("search")
        .value
        .toLowerCase();

    const result=products.filter(p=>
        (p.name+" "+p.type)
        .toLowerCase()
        .includes(text)
    );

    displayProducts(result);
}


function openProduct(index){

    const p=products[index];

    document.getElementById("selectedProduct")
        .innerText=p.name;

    document.getElementById("p1")
        .innerText="1 Day — ₹"+p.d1;

    document.getElementById("p3")
        .innerText="3 Days — ₹"+p.d3;

    document.getElementById("p7")
        .innerText="7 Days — ₹"+p.d7;

    document.getElementById("productModal")
        .style.display="flex";
}


function openLogin(){

    closeAll();

    document.getElementById("loginModal")
        .style.display="flex";
}


function openRegister(){

    closeAll();

    document.getElementById("registerModal")
        .style.display="flex";
}


function closeAll(){

    document.querySelectorAll(".modal")
        .forEach(m=>m.style.display="none");

}


async function register(){

    const username=
        document.getElementById("registerUsername").value.trim();

    const password=
        document.getElementById("registerPassword").value;

    const confirm=
        document.getElementById("registerConfirm").value;

    if(!username || !password){

        alert("Username aur password enter karo");

        return;
    }

    if(password!==confirm){

        alert("Password match nahi kar raha");

        return;
    }

    try{

        const response=await fetch("/api/register",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                password
            })

        });

        const data=await response.json();

        alert(data.message);

        if(data.success){

            closeAll();

        }

    }catch(error){

        alert("Server error");

    }

}


async function login(){

    const username=
        document.getElementById("loginUsername").value.trim();

    const password=
        document.getElementById("loginPassword").value;

    if(!username || !password){

        alert("Username aur password enter karo");

        return;
    }

    try{

        const response=await fetch("/api/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                password
            })

        });

        const data=await response.json();

        alert(data.message);

        if(data.success){

            localStorage.setItem(
                "biruxyUser",
                username
            );

            closeAll();

        }

    }catch(error){

        alert("Server error");

    }

}


function logout(){

    localStorage.removeItem("biruxyUser");

    alert("Logout successful");

}


displayProducts();

</script>

</body>
</html>
